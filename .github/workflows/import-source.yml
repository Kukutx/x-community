name: Verify source import channel

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.issue.title == 'VERIFY_X_COMMUNITY_IMPORT_CHANNEL_20260804'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record successful issue trigger
        shell: bash
        run: |
          set -euo pipefail
          printf 'issue_event_triggered=true\nno_deployment=true\n' > .github/import/ACTIONS_OK
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/import/ACTIONS_OK
          git commit -m 'chore: verify source import channel'
          git push origin HEAD:master
