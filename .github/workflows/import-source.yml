name: Import verified source snapshot

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: x-community-source-import
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event.issue.title == 'IMPORT_X_COMMUNITY_SOURCE_20260804' &&
      startsWith(github.event.comment.body, 'XCOMMUNITY_READY ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          READY_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import tarfile
          import urllib.request
          from pathlib import PurePosixPath

          repository = os.environ['GITHUB_REPOSITORY']
          issue_number = os.environ['ISSUE_NUMBER']
          token = os.environ['GH_TOKEN']
          ready = os.environ['READY_BODY'].strip()

          match = re.fullmatch(r'XCOMMUNITY_READY parts=(\d{3}) sha256=([0-9a-f]{64})', ready)
          if match is None:
              raise SystemExit('invalid READY control record')
          expected_parts = int(match.group(1))
          expected_sha256 = match.group(2)

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/issues/{issue_number}/comments?per_page=100',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'x-community-source-import',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              comments = json.load(response)

          pattern = re.compile(r'^XCOMMUNITY_PART (\d{3})/(\d{3})\n([A-Za-z0-9+/=]+)$')
          parts: dict[int, str] = {}
          payload_comment_ids: list[int] = []
          for comment in comments:
              body = comment.get('body') or ''
              part_match = pattern.fullmatch(body)
              if part_match is None:
                  if body.startswith('XCOMMUNITY_READY '):
                      payload_comment_ids.append(int(comment['id']))
                  continue
              index = int(part_match.group(1))
              declared_total = int(part_match.group(2))
              if declared_total != expected_parts:
                  raise SystemExit(f'part {index:03d} declares unexpected total')
              if index in parts:
                  raise SystemExit(f'duplicate part {index:03d}')
              parts[index] = part_match.group(3)
              payload_comment_ids.append(int(comment['id']))

          expected_indexes = set(range(expected_parts))
          if set(parts) != expected_indexes:
              missing = sorted(expected_indexes - set(parts))
              extra = sorted(set(parts) - expected_indexes)
              raise SystemExit(f'part set mismatch; missing={missing}, extra={extra}')

          encoded = ''.join(parts[index] for index in range(expected_parts))
          archive = base64.b64decode(encoded, validate=True)
          actual_sha256 = hashlib.sha256(archive).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'archive digest mismatch: {actual_sha256}')
          if len(archive) != 144544:
              raise SystemExit(f'unexpected archive size: {len(archive)}')

          archive_path = '/tmp/x-community-source.tar.xz'
          with open(archive_path, 'wb') as output:
              output.write(archive)

          with tarfile.open(archive_path, mode='r:xz') as source:
              members = source.getmembers()
              if not members or len(members) > 500:
                  raise SystemExit(f'unsafe archive member count: {len(members)}')
              total_size = 0
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or '.git' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsafe archive member type: {member.name}')
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f'unsupported archive member: {member.name}')
                  total_size += member.size
              if total_size > 5 * 1024 * 1024:
                  raise SystemExit(f'archive expands beyond safety limit: {total_size}')
              source.extractall('.', filter='data')

          with open('/tmp/source-import-comment-ids.json', 'w', encoding='utf-8') as output:
              json.dump(payload_comment_ids, output)
          print(f'verified {len(members)} archive members; sha256={actual_sha256}')
          PY

      - name: Replace temporary importer with source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/import
          rm -f .github/workflows/import-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'feat: import x-community project source'
          git push origin HEAD:master

      - name: Remove transfer payload and close issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          issue_number = os.environ['ISSUE_NUMBER']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'x-community-source-import',
          }
          with open('/tmp/source-import-comment-ids.json', encoding='utf-8') as source:
              comment_ids = json.load(source)
          for comment_id in comment_ids:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/issues/comments/{comment_id}',
                  headers=headers,
                  method='DELETE',
              )
              try:
                  urllib.request.urlopen(request, timeout=20).read()
              except urllib.error.HTTPError as error:
                  print(f'warning: failed to delete comment {comment_id}: {error.code}')

          body = json.dumps({
              'state': 'closed',
              'state_reason': 'completed',
              'body': 'Verified source snapshot imported. Transfer comments were removed. No deployment was performed.',
          }).encode()
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/issues/{issue_number}',
              data=body,
              headers={**headers, 'Content-Type': 'application/json'},
              method='PATCH',
          )
          urllib.request.urlopen(request, timeout=20).read()
          PY
