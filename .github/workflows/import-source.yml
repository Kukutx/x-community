name: Import source snapshot

on:
  push:
    branches: [master]
    paths:
      - '.github/import/READY'

permissions:
  contents: write

concurrency:
  group: import-source-snapshot
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/import -maxdepth 1 -name 'source.part.*' -type f | wc -l)" -eq 13
          cat .github/import/source.part.* | base64 --decode > /tmp/source.tar.gz
          echo '8bf9788b6329aa82c09af3ec2d5dbc27b04d51b5a99822a764bdebd04d86ea6f  /tmp/source.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/source.tar.gz | grep -Ev '(^|/)\.\.?(/|$)|(^|/)\.git(/|$)' >/dev/null

      - name: Import source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/source.tar.gz -C .
          rm -rf .github/import

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: import x-community project source'
          git push origin HEAD:master
